services:
  # ─────────────────────────────────────────
  # Microsoft SQL Server 2022
  # ─────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: smartcctv_sqlserver
    env_file: .env
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: >
        /bin/bash -c "
          /opt/mssql-tools18/bin/sqlcmd
          -S localhost -U sa -P \"${MSSQL_SA_PASSWORD}\"
          -C -Q 'SELECT 1' > /dev/null 2>&1 || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ─────────────────────────────────────────
  # FastAPI Backend (REST API + AI Engine)
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartcctv_backend
    env_file: .env
    environment:
      DATABASE_URL: "mssql+pyodbc://sa:${MSSQL_SA_PASSWORD}@sqlserver:1433/${MSSQL_DB}?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
      SECRET_KEY: "${BACKEND_SECRET_KEY}"
      ACCESS_TOKEN_EXPIRE_MINUTES: "${BACKEND_ACCESS_TOKEN_EXPIRE_MINUTES}"
      SNAPSHOT_DIR: "${SNAPSHOT_DIR}"
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN}"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Persistensi foto bukti pelanggaran
      - snapshot_storage:/app/storage/snapshots
      # Mount folder weights agar bisa update model .pt tanpa rebuild image
      - ./backend/app/ai/weights:/app/app/ai/weights:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  # ─────────────────────────────────────────
  # MediaMTX — RTSP to WebRTC/HLS Gateway
  # ─────────────────────────────────────────
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: smartcctv_mediamtx
    ports:
      - "8554:8554"   # RTSP server
      - "8889:8889"   # WebRTC (browser player)
      - "8888:8888"   # HLS fallback
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped

  # ─────────────────────────────────────────
  # ASP.NET MVC 5 Frontend (BFF)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartcctv_frontend
    environment:
      FASTAPI_BASE_URL: "http://backend:8000"
    ports:
      - "127.0.0.1:8086:8080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mssql_data:
    driver: local
  snapshot_storage:
    driver: local
